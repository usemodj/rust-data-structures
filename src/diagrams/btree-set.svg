<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">BTreeSet 정렬된 고유 키</title>
  <desc id="desc">루트의 키 20과 40을 기준으로 세 자식의 키가 나뉘고 10, 15, 20, 25, 30, 40, 45, 50 순서로 순회하는 개념도</desc>
  <rect x="1" y="1" width="898" height="438" rx="18" fill="#f4f8ef" stroke="#d8e6d5" stroke-width="2"/>
  <text x="38" y="43" fill="#50745c" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700">BTreeSet · 정렬된 고유 키</text>
  <text x="38" y="76" fill="#4b6955" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18">Ord 순서에 따라 저장하며 중복된 키는 하나만 남습니다.</text>
  <g stroke="#8aad94" stroke-width="2.5" fill="none"><path d="M370 177 C320 203 255 214 180 230"/><path d="M450 177 L450 230"/><path d="M530 177 C580 203 645 214 720 230"/></g>
  <text x="450" y="104" text-anchor="middle" fill="#526d59" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">루트 노드</text>
  <rect x="331" y="119" width="238" height="60" rx="12" fill="#285d43"/>
  <line x1="450" y1="130" x2="450" y2="168" stroke="#78a587" stroke-width="1.5"/>
  <g fill="#fff" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle"><text x="390" y="156">20</text><text x="509" y="156">40</text></g>
  <g fill="#496953" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" text-anchor="middle"><text x="180" y="222">20보다 작음</text><text x="450" y="222">20과 40 사이</text><text x="720" y="222">40보다 큼</text></g>
  <g fill="#fff" stroke="#cadfcd" stroke-width="2"><rect x="62" y="236" width="236" height="56" rx="11"/><rect x="332" y="236" width="236" height="56" rx="11"/><rect x="602" y="236" width="236" height="56" rx="11"/></g>
  <g fill="#315d40" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle"><text x="180" y="271">10   15</text><text x="450" y="271">25   30</text><text x="720" y="271">45   50</text></g>
  <rect x="37" y="329" width="826" height="76" rx="12" fill="#e2edda"/>
  <text x="58" y="353" fill="#50745c" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" font-weight="700">키 순회 결과 · 오름차순</text>
  <text x="58" y="385" fill="#284b35" font-family="Consolas, monospace" font-size="19" font-weight="700">10 → 15 → 20 → 25 → 30 → 40 → 45 → 50</text>
</svg>
