<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">VecDeque의 FIFO 링 버퍼</title>
  <desc id="desc">논리적 큐 순서 A, B, C가 물리 배열의 4, 5, 0번 위치에 저장된 링 버퍼 개념도입니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b76a1b"/></marker></defs>
  <rect x="1" y="1" width="898" height="438" rx="18" fill="#f4f8ef" stroke="#d8e6d5" stroke-width="2"/>
  <text x="38" y="44" fill="#285d43" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="25" font-weight="700">VecDeque · 논리적 순서와 링 버퍼</text>
  <text x="38" y="78" fill="#4b6955" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18">앞에서 꺼내고 뒤에 넣는 FIFO 예시</text>
  <text x="62" y="132" fill="#315d40" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700">논리적 큐</text>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" text-anchor="middle" font-size="22" fill="#173b2b">
    <rect x="250" y="99" width="120" height="52" rx="8" fill="#d5f0d9" stroke="#28784d" stroke-width="2"/><text x="310" y="133">A</text>
    <rect x="390" y="99" width="120" height="52" rx="8" fill="#d5f0d9" stroke="#28784d" stroke-width="2"/><text x="450" y="133">B</text>
    <rect x="530" y="99" width="120" height="52" rx="8" fill="#d5f0d9" stroke="#28784d" stroke-width="2"/><text x="590" y="133">C</text>
    <text x="310" y="178" font-size="17">앞 · pop_front</text><text x="590" y="178" font-size="17">뒤 · push_back</text>
  </g>
  <text x="62" y="235" fill="#315d40" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700">물리 배열</text>
  <g font-family="Consolas, monospace" text-anchor="middle" font-size="20" fill="#173b2b">
    <rect x="210" y="210" width="100" height="58" fill="#d5f0d9" stroke="#28784d" stroke-width="2"/><text x="260" y="247">C</text>
    <rect x="310" y="210" width="100" height="58" fill="#fff" stroke="#adcbb3" stroke-width="2"/><rect x="410" y="210" width="100" height="58" fill="#fff" stroke="#adcbb3" stroke-width="2"/><rect x="510" y="210" width="100" height="58" fill="#fff" stroke="#adcbb3" stroke-width="2"/>
    <rect x="610" y="210" width="100" height="58" fill="#d5f0d9" stroke="#28784d" stroke-width="2"/><text x="660" y="247">A</text>
    <rect x="710" y="210" width="100" height="58" fill="#d5f0d9" stroke="#28784d" stroke-width="2"/><text x="760" y="247">B</text>
    <text x="260" y="296">0</text><text x="360" y="296">1</text><text x="460" y="296">2</text><text x="560" y="296">3</text><text x="660" y="296">4</text><text x="760" y="296">5</text>
  </g>
  <path d="M760 320 C760 380 260 380 260 320" fill="none" stroke="#b76a1b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="365" text-anchor="middle" fill="#80501f" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18">배열 끝에서 시작으로 이어짐</text>
  <text x="450" y="414" text-anchor="middle" fill="#4b6955" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17">개념도: 실제 내부 위치와 용량은 작업에 따라 달라집니다.</text>
</svg>
