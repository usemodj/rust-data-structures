<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 900 440">
  <title>정렬된 배열에서 이진 검색 범위 줄이기</title>
  <desc>1, 3, 5, 7, 9, 11, 13이 정렬된 배열에서 목표 9를 찾는다. 가운데 7보다 크므로 왼쪽 경계를 옮기고, 다음 가운데 11보다 작으므로 오른쪽 경계를 옮겨 9만 남긴다.</desc>
  <rect width="900" height="440" fill="#f2f8f4"/>
  <g font-family="sans-serif" fill="#173b2b">
    <text x="450" y="42" text-anchor="middle" font-size="28" font-weight="bold">이진 검색: 탐색 범위를 절반씩 줄이기</text>
    <text x="450" y="78" text-anchor="middle" font-size="20">오름차순 배열 · 목표 9 · 경계는 [왼쪽, 오른쪽)</text>
    <text x="84" y="126" font-size="20">1회: [0, 7)</text>
    <g stroke="#2d6a4f" stroke-width="2"><rect x="80" y="145" width="100" height="58" rx="8" fill="#d8eee0"/><rect x="180" y="145" width="100" height="58" rx="8" fill="#d8eee0"/><rect x="280" y="145" width="100" height="58" rx="8" fill="#d8eee0"/><rect x="380" y="145" width="100" height="58" rx="8" fill="#b7dfc5"/><rect x="480" y="145" width="100" height="58" rx="8" fill="#d8eee0"/><rect x="580" y="145" width="100" height="58" rx="8" fill="#d8eee0"/><rect x="680" y="145" width="100" height="58" rx="8" fill="#d8eee0"/></g>
    <g font-size="24" text-anchor="middle"><text x="130" y="182">1</text><text x="230" y="182">3</text><text x="330" y="182">5</text><text x="430" y="182">7</text><text x="530" y="182">9</text><text x="630" y="182">11</text><text x="730" y="182">13</text></g>
    <text x="430" y="230" text-anchor="middle" font-size="20">가운데 7 &lt; 9 → 왼쪽을 4로 이동</text>
    <text x="84" y="270" font-size="20">2회: [4, 7)</text>
    <g stroke="#2d6a4f" stroke-width="2"><rect x="480" y="285" width="100" height="58" rx="8" fill="#d8eee0"/><rect x="580" y="285" width="100" height="58" rx="8" fill="#b7dfc5"/><rect x="680" y="285" width="100" height="58" rx="8" fill="#d8eee0"/></g>
    <g font-size="24" text-anchor="middle"><text x="530" y="322">9</text><text x="630" y="322">11</text><text x="730" y="322">13</text></g>
    <text x="630" y="370" text-anchor="middle" font-size="20">가운데 11 &gt; 9 → 오른쪽을 5로 이동</text>
    <text x="530" y="412" text-anchor="middle" font-size="22" font-weight="bold">[4, 5): 9 발견</text>
  </g>
</svg>
