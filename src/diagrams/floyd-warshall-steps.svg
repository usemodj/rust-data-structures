<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">플로이드–워셜 예제의 단계별 거리 행렬</title>
  <desc id="desc">정점 0에서 1로 가중치 4, 1에서 2로 가중치 -2, 0에서 2로 가중치 11인 방향 그래프입니다. 초기 거리 행렬은 0,4,11; 도달 불가,0,-2; 도달 불가,도달 불가,0입니다. 중간 정점 0에서는 변화가 없고, 중간 정점 1에서 0에서 2까지의 거리가 4 더하기 -2인 2로 바뀝니다. 중간 정점 2에서는 변화가 없습니다.</desc>
  <rect x="1" y="1" width="998" height="748" rx="18" fill="#f4f8ef" stroke="#d8e6d5" stroke-width="2"/>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" fill="#173b2b">
    <text x="500" y="43" text-anchor="middle" fill="#285d43" font-size="25" font-weight="700">플로이드–워셜 · 중간 정점별 거리 변화</text>
    <text x="500" y="75" text-anchor="middle" fill="#506e59" font-size="17">Rust 예제 방향 간선: 0 → 1 (4), 1 → 2 (−2), 0 → 2 (11)</text>
    <rect x="35" y="94" width="930" height="68" rx="12" fill="#fff" stroke="#cfdfce" stroke-width="2"/>
    <text x="60" y="123" font-size="17" fill="#285d43">행 = 출발 정점 · 열 = 도착 정점 · ∞ = None (도달 불가)</text>
    <text x="60" y="147" font-size="16" fill="#506e59">각 행렬은 표시된 k의 처리가 끝난 뒤입니다. 대각선은 0으로 초기화합니다.</text>
    <g transform="translate(35 180)">
      <rect width="450" height="220" rx="14" fill="#fff" stroke="#cfdfce" stroke-width="2"/>
      <text x="24" y="34" fill="#285d43" font-size="19" font-weight="700">초기 거리 행렬</text>
      <g text-anchor="middle" font-family="Consolas, monospace" font-size="19">
        <g fill="#506e59"><text x="70" y="72">i / j</text><text x="170" y="72">0</text><text x="260" y="72">1</text><text x="350" y="72">2</text></g>
        <g fill="#173b2b"><text x="70" y="112">0</text><text x="170" y="112">0</text><text x="260" y="112">4</text><text x="350" y="112">11</text><text x="70" y="150">1</text><text x="170" y="150">∞</text><text x="260" y="150">0</text><text x="350" y="150">−2</text><text x="70" y="188">2</text><text x="170" y="188">∞</text><text x="260" y="188">∞</text><text x="350" y="188">0</text></g>
      </g>
    </g>
    <g transform="translate(515 180)">
      <rect width="450" height="220" rx="14" fill="#fff" stroke="#cfdfce" stroke-width="2"/>
      <text x="24" y="34" fill="#285d43" font-size="19" font-weight="700">k = 0 처리 후 · 변화 없음</text>
      <g text-anchor="middle" font-family="Consolas, monospace" font-size="19">
        <g fill="#506e59"><text x="70" y="72">i / j</text><text x="170" y="72">0</text><text x="260" y="72">1</text><text x="350" y="72">2</text></g>
        <g fill="#173b2b"><text x="70" y="112">0</text><text x="170" y="112">0</text><text x="260" y="112">4</text><text x="350" y="112">11</text><text x="70" y="150">1</text><text x="170" y="150">∞</text><text x="260" y="150">0</text><text x="350" y="150">−2</text><text x="70" y="188">2</text><text x="170" y="188">∞</text><text x="260" y="188">∞</text><text x="350" y="188">0</text></g>
      </g>
    </g>
    <g transform="translate(35 420)">
      <rect width="450" height="220" rx="14" fill="#fff" stroke="#cfdfce" stroke-width="2"/>
      <text x="24" y="34" fill="#285d43" font-size="19" font-weight="700">k = 1 처리 후 · 0 → 2 갱신</text>
      <rect x="320" y="85" width="60" height="36" rx="7" fill="#d5efdc" stroke="#68a078"/>
      <g text-anchor="middle" font-family="Consolas, monospace" font-size="19">
        <g fill="#506e59"><text x="70" y="72">i / j</text><text x="170" y="72">0</text><text x="260" y="72">1</text><text x="350" y="72">2</text></g>
        <g fill="#173b2b"><text x="70" y="112">0</text><text x="170" y="112">0</text><text x="260" y="112">4</text><text x="350" y="112">2</text><text x="70" y="150">1</text><text x="170" y="150">∞</text><text x="260" y="150">0</text><text x="350" y="150">−2</text><text x="70" y="188">2</text><text x="170" y="188">∞</text><text x="260" y="188">∞</text><text x="350" y="188">0</text></g>
      </g>
    </g>
    <g transform="translate(515 420)">
      <rect width="450" height="220" rx="14" fill="#fff" stroke="#cfdfce" stroke-width="2"/>
      <text x="24" y="34" fill="#285d43" font-size="19" font-weight="700">k = 2 처리 후 · 변화 없음</text>
      <g text-anchor="middle" font-family="Consolas, monospace" font-size="19">
        <g fill="#506e59"><text x="70" y="72">i / j</text><text x="170" y="72">0</text><text x="260" y="72">1</text><text x="350" y="72">2</text></g>
        <g fill="#173b2b"><text x="70" y="112">0</text><text x="170" y="112">0</text><text x="260" y="112">4</text><text x="350" y="112">2</text><text x="70" y="150">1</text><text x="170" y="150">∞</text><text x="260" y="150">0</text><text x="350" y="150">−2</text><text x="70" y="188">2</text><text x="170" y="188">∞</text><text x="260" y="188">∞</text><text x="350" y="188">0</text></g>
      </g>
    </g>
    <text x="500" y="690" text-anchor="middle" fill="#285d43" font-size="19" font-weight="700">k = 1: D[0][2] = min(11, 4 + (−2)) = 2</text>
    <text x="500" y="718" text-anchor="middle" fill="#506e59" font-size="16">경로가 없는 경우는 더하지 않으며, 이 예제에는 음의 사이클이 없습니다.</text>
  </g>
</svg>
