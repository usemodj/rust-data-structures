<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Rust 다익스트라 예제의 단계별 실행</title>
  <desc id="desc">정점 0에서 시작해 BinaryHeap과 Reverse로 가장 작은 거리 후보를 꺼내고, 같은 거리에서는 정점 번호가 작은 후보를 먼저 처리하며, 오래된 후보 (4, 1)과 (6, 3)을 건너뛰고 최종 거리 Some(0), Some(3), Some(1), Some(4)를 구하는 단계별 시각화</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#286b59"/></marker>
    <style>
      .panel { fill: #f5fbf8; stroke: #77aa99; stroke-width: 2; }
      .edge { stroke: #286b59; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .node { fill: #fff; stroke: #286b59; stroke-width: 3; }
      .active { fill: #bcebd7; }
      .stale { fill: #ffe1d5; stroke: #bd644c; }
      .label { font-family: sans-serif; fill: #183f36; }
      .small { font-size: 17px; }
      .body { font-size: 19px; }
    </style>
  </defs>
  <rect width="1200" height="790" rx="20" fill="#edf8f3"/>
  <text x="600" y="42" text-anchor="middle" class="label" font-size="27" font-weight="700">Rust 다익스트라 예제: BinaryHeap 단계별 추적</text>
  <text x="600" y="70" text-anchor="middle" class="label" font-size="17">graph = [ [(1,4),(2,1)], [(3,1)], [(1,2),(3,5)], [] ], 시작 정점 0</text>

  <g transform="translate(25 95)">
    <rect class="panel" width="365" height="205" rx="14"/>
    <text x="20" y="32" class="label" font-size="21" font-weight="700">0. 시작</text>
    <text x="20" y="64" class="label body">dist = [0, ∞, ∞, ∞]</text>
    <text x="20" y="98" class="label body">heap: [(0, 0)]</text>
    <text x="20" y="140" class="label small">Reverse((거리, 정점))을</text>
    <text x="20" y="166" class="label small">BinaryHeap에 넣는다.</text>
    <text x="20" y="190" class="label" font-size="14">∞는 None, 숫자 d는 Some(d).</text>
  </g>
  <g transform="translate(417 95)">
    <rect class="panel" width="365" height="205" rx="14"/>
    <text x="20" y="32" class="label" font-size="21" font-weight="700">1. 0 확정</text>
    <text x="20" y="64" class="label body">0→1: 4, 0→2: 1</text>
    <text x="20" y="98" class="label body">dist = [0, 4, 1, ∞]</text>
    <text x="20" y="132" class="label body">heap: [(1,2), (4,1)]</text>
    <text x="20" y="170" class="label small">작은 거리 1의 (1,2)를 다음에 꺼낸다.</text>
  </g>
  <g transform="translate(809 95)">
    <rect class="panel" width="365" height="205" rx="14"/>
    <text x="20" y="32" class="label" font-size="21" font-weight="700">2. 2 확정</text>
    <text x="20" y="64" class="label body">2→1: 3, 2→3: 6</text>
    <text x="20" y="98" class="label body">dist = [0, 3, 1, 6]</text>
    <text x="20" y="132" class="label body">heap: [(3,1), (4,1), (6,3)]</text>
    <text x="20" y="170" class="label small">기존 (4,1)은 남기고 (3,1)을 추가.</text>
  </g>

  <g transform="translate(25 325)">
    <rect class="panel" width="365" height="205" rx="14"/>
    <text x="20" y="32" class="label" font-size="21" font-weight="700">3. 1 확정</text>
    <text x="20" y="64" class="label body">1→3: 3 + 1 = 4</text>
    <text x="20" y="98" class="label body">dist = [0, 3, 1, 4]</text>
    <text x="20" y="132" class="label body">heap: [(4,1), (4,3), (6,3)]</text>
    <text x="20" y="170" class="label small">이제 거리 4 후보가 두 개다.</text>
  </g>
  <g transform="translate(417 325)">
    <rect class="panel" width="365" height="205" rx="14"/>
    <text x="20" y="32" class="label" font-size="21" font-weight="700">4. 동률과 오래된 후보</text>
    <text x="20" y="64" class="label body">동률이면 (4,1)이 먼저 나온다.</text>
    <text x="20" y="98" class="label body">현재 distance[1] = Some(3)</text>
    <text x="20" y="132" class="label body">4 ≠ 3 → 오래된 후보 건너뜀</text>
    <text x="20" y="170" class="label small">간선을 완화하지 않고 다음 후보로.</text>
  </g>
  <g transform="translate(809 325)">
    <rect class="panel" width="365" height="205" rx="14"/>
    <text x="20" y="32" class="label" font-size="21" font-weight="700">5. 3 확정</text>
    <text x="20" y="64" class="label body">(4,3)을 꺼내고 간선 없음</text>
    <text x="20" y="98" class="label body">dist = [0, 3, 1, 4]</text>
    <text x="20" y="132" class="label body">heap: [(6,3)]</text>
    <text x="20" y="170" class="label small">현재 거리: [0, 3, 1, 4]</text>
  </g>

  <g transform="translate(25 560)">
    <rect width="1149" height="180" rx="14" fill="#fff1eb" stroke="#bd644c" stroke-width="2"/>
    <text x="22" y="35" class="label" font-size="21" font-weight="700" fill="#7c3527">6. 오래된 큐 항목 건너뛰기</text>
    <text x="22" y="72" class="label body">heap에서 Reverse((6,3))을 꺼내지만 현재 distance[3]은 Some(4)이다.</text>
    <text x="22" y="108" class="label body">distance[vertex] != Some(cost) 이므로 continue: 오래된 후보 (6,3)은 간선을 다시 완화하지 않는다.</text>
    <text x="22" y="144" class="label small">Reverse는 BinaryHeap의 최대 힙을 최소 거리 우선처럼 사용하게 하며, tuple의 두 번째 값이 동률을 결정한다.</text>
  </g>
</svg>
