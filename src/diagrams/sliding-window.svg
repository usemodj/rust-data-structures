<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 900 440">
  <title>고정 크기 슬라이딩 윈도우의 최댓값</title>
  <desc>2, 1, 5, 1, 3, 2에서 크기 3인 윈도우를 이동하며 합 8, 7, 9, 6 중 최댓값 9를 찾음</desc>
  <rect width="900" height="440" fill="#f2f8f4"/>
  <g font-family="sans-serif" fill="#173b2b">
    <text x="55" y="55" font-size="28" font-weight="700">고정 크기 윈도우 · k = 3</text>
    <text x="55" y="90" font-size="20">한 칸 이동: 왼쪽 값은 빼고 오른쪽 값은 더합니다</text>
    <g stroke="#286044" stroke-width="2"><rect x="90" y="145" width="110" height="68" fill="#b9dfc8"/><rect x="200" y="145" width="110" height="68" fill="#b9dfc8"/><rect x="310" y="145" width="110" height="68" fill="#b9dfc8"/><rect x="420" y="145" width="110" height="68" fill="#d9eee1"/><rect x="530" y="145" width="110" height="68" fill="#d9eee1"/><rect x="640" y="145" width="110" height="68" fill="#d9eee1"/></g>
    <g font-size="27" text-anchor="middle"><text x="145" y="188">2</text><text x="255" y="188">1</text><text x="365" y="188">5</text><text x="475" y="188">1</text><text x="585" y="188">3</text><text x="695" y="188">2</text></g>
    <path d="M90 130v-24h330v24" fill="none" stroke="#1c7c54" stroke-width="5"/><text x="255" y="94" text-anchor="middle" font-size="20">창 1: 합 8</text>
    <path d="M200 260v24h330v-24" fill="none" stroke="#1c7c54" stroke-width="5"/><text x="365" y="320" text-anchor="middle" font-size="20">창 2: 8 − 2 + 1 = 7</text>
    <path d="M310 350v24h330v-24" fill="none" stroke="#1c7c54" stroke-width="5"/><text x="475" y="414" text-anchor="middle" font-size="20" font-weight="700">창 3: 7 − 1 + 3 = 9  ✓ 최댓값</text>
    <text x="790" y="250" text-anchor="middle" font-size="20">창 4: 6</text>
  </g>
</svg>
