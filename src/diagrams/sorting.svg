<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 900 440">
  <title>정렬 알고리즘의 입력과 출력</title>
  <desc>섞인 수열 8, 3, 5, 1을 비교하고 이동하여 오름차순 수열 1, 3, 5, 8을 만드는 일반적인 정렬 흐름을 보여준다.</desc>
  <rect width="900" height="440" fill="#f2f8f4"/>
  <g font-family="sans-serif" fill="#173b2b">
    <text x="450" y="48" text-anchor="middle" font-size="30" font-weight="bold">정렬: 순서를 비교해 다시 배열하기</text>
    <text x="450" y="92" text-anchor="middle" font-size="21">입력 수열</text>
    <g stroke="#2d6a4f" stroke-width="2"><rect x="100" y="112" width="130" height="62" rx="8" fill="#d8eee0"/><rect x="230" y="112" width="130" height="62" rx="8" fill="#d8eee0"/><rect x="360" y="112" width="130" height="62" rx="8" fill="#d8eee0"/><rect x="490" y="112" width="130" height="62" rx="8" fill="#d8eee0"/></g>
    <g font-size="27" text-anchor="middle"><text x="165" y="152">8</text><text x="295" y="152">3</text><text x="425" y="152">5</text><text x="555" y="152">1</text></g>
    <path d="M450 190v62" stroke="#40916c" stroke-width="5"/><path d="m438 238 12 16 12-16" fill="none" stroke="#40916c" stroke-width="5"/>
    <text x="450" y="226" text-anchor="middle" font-size="20">비교 · 선택 · 이동</text>
    <text x="450" y="292" text-anchor="middle" font-size="21">오름차순 결과</text>
    <g stroke="#2d6a4f" stroke-width="2"><rect x="100" y="312" width="130" height="62" rx="8" fill="#b7dfc5"/><rect x="230" y="312" width="130" height="62" rx="8" fill="#b7dfc5"/><rect x="360" y="312" width="130" height="62" rx="8" fill="#b7dfc5"/><rect x="490" y="312" width="130" height="62" rx="8" fill="#b7dfc5"/></g>
    <g font-size="27" text-anchor="middle"><text x="165" y="352">1</text><text x="295" y="352">3</text><text x="425" y="352">5</text><text x="555" y="352">8</text></g>
    <text x="700" y="150" font-size="20">작은 값 → 큰 값</text><text x="700" y="182" font-size="20">중복 값도 보존</text>
  </g>
</svg>
