<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc">
  <title id="title">퀵 정렬 예제의 3-way 분할 단계</title>
  <desc id="desc">입력 9, 3, 7, 3, 1, 8, 2에서 첫 값 9, 가운데 값 3, 마지막 값 2의 중앙값 3을 피벗으로 선택합니다. 일곱 번 비교하여 2, 1은 작은 구간, 3, 3은 같은 구간, 8, 7, 9는 큰 구간이 됩니다. 작은 구간과 큰 구간을 정렬한 최종 결과는 1, 2, 3, 3, 7, 8, 9입니다.</desc>
  <rect x="1" y="1" width="1198" height="823" rx="18" fill="#f4f8ef" stroke="#d8e6d5" stroke-width="2"/>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" fill="#173b2b">
    <text x="600" y="43" text-anchor="middle" fill="#285d43" font-size="25" font-weight="700">퀵 정렬 · 3-way 분할 단계</text>
    <text x="600" y="75" text-anchor="middle" fill="#506e59" font-size="17">Rust 예제 입력 [9, 3, 7, 3, 1, 8, 2] · 오름차순</text>
    <rect x="35" y="95" width="1130" height="90" rx="14" fill="#fff" stroke="#cfdfce" stroke-width="2"/>
    <text x="65" y="132" font-size="19" font-weight="700" fill="#285d43">피벗 선택: 첫 값 9 · 가운데 값 3 · 마지막 값 2 → 중앙값 3</text>
    <text x="65" y="162" font-size="16" fill="#506e59">l = less, c = current, g = greater · 각 행은 비교와 교환을 마친 직후 상태</text>
    <rect x="35" y="205" width="1130" height="435" rx="14" fill="#fff" stroke="#cfdfce" stroke-width="2"/>
    <path d="M35 258 H1165 M35 312 H1165 M35 366 H1165 M35 420 H1165 M35 474 H1165 M35 528 H1165 M35 582 H1165" stroke="#dce8dd" stroke-width="1.5"/>
    <g font-size="17" font-weight="700" fill="#506e59"><text x="60" y="239">단계</text><text x="145" y="239">비교와 동작 (교환은 인덱스)</text><text x="485" y="239">처리 후 배열</text><text x="1005" y="239">l, c, g</text></g>
    <g font-size="17">
      <text x="60" y="292">1</text><text x="145" y="292">9 &gt; 3 · 0과 6 교환</text><text x="485" y="292" font-family="Consolas, monospace">[2, 3, 7, 3, 1, 8, 9]</text><text x="1005" y="292">0, 0, 6</text>
      <text x="60" y="346">2</text><text x="145" y="346">2 &lt; 3 · 작은 구간 확장</text><text x="485" y="346" font-family="Consolas, monospace">[2, 3, 7, 3, 1, 8, 9]</text><text x="1005" y="346">1, 1, 6</text>
      <text x="60" y="400">3</text><text x="145" y="400">3 = 3 · 같은 구간 확장</text><text x="485" y="400" font-family="Consolas, monospace">[2, 3, 7, 3, 1, 8, 9]</text><text x="1005" y="400">1, 2, 6</text>
      <text x="60" y="454">4</text><text x="145" y="454">7 &gt; 3 · 2와 5 교환</text><text x="485" y="454" font-family="Consolas, monospace">[2, 3, 8, 3, 1, 7, 9]</text><text x="1005" y="454">1, 2, 5</text>
      <text x="60" y="508">5</text><text x="145" y="508">8 &gt; 3 · 2와 4 교환</text><text x="485" y="508" font-family="Consolas, monospace">[2, 3, 1, 3, 8, 7, 9]</text><text x="1005" y="508">1, 2, 4</text>
      <text x="60" y="562">6</text><text x="145" y="562">1 &lt; 3 · 1과 2 교환</text><text x="485" y="562" font-family="Consolas, monospace">[2, 1, 3, 3, 8, 7, 9]</text><text x="1005" y="562">2, 3, 4</text>
      <text x="60" y="616">7</text><text x="145" y="616">3 = 3 · c = g, 분할 종료</text><text x="485" y="616" font-family="Consolas, monospace">[2, 1, 3, 3, 8, 7, 9]</text><text x="1005" y="616">2, 4, 4</text>
    </g>
    <text x="60" y="687" font-size="19" font-weight="700" fill="#285d43">분할 결과: [2, 1] · [3, 3] · [8, 7, 9]</text>
    <text x="60" y="722" font-size="18">작은 부분과 큰 부분을 정렬 → [1, 2] · [3, 3] · [7, 8, 9]</text>
    <text x="60" y="757" font-size="18" font-weight="700">최종 결과: [1, 2, 3, 3, 7, 8, 9]</text>
    <text x="60" y="797" font-size="15" fill="#506e59">구간: [0, l) 작음 · [l, c) 같음 · [c, g) 미확인 · [g, n) 큼</text>
  </g>
</svg>
