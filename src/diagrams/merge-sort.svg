<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 900 440">
  <title>병합 정렬의 분할과 병합</title>
  <desc>5, 1, 4, 3을 두 부분으로 나누고 각각 정렬한 뒤 두 포인터로 작은 값을 선택해 1, 3, 4, 5로 병합한다.</desc>
  <rect width="900" height="440" fill="#f2f8f4"/>
  <g font-family="sans-serif" fill="#173b2b">
    <text x="450" y="42" text-anchor="middle" font-size="29" font-weight="bold">병합 정렬: 나누고, 정렬하고, 병합하기</text>
    <text x="450" y="82" text-anchor="middle" font-size="21">입력</text>
    <g stroke="#2d6a4f" stroke-width="2"><rect x="280" y="96" width="170" height="52" rx="8" fill="#d8eee0"/><rect x="450" y="96" width="170" height="52" rx="8" fill="#d8eee0"/></g>
    <text x="365" y="130" text-anchor="middle" font-size="24">5  1</text><text x="535" y="130" text-anchor="middle" font-size="24">4  3</text>
    <path d="M450 158v42M450 200H365M450 200H535" fill="none" stroke="#40916c" stroke-width="4"/><path d="m358 190 7 12 7-12M528 190l7 12 7-12" fill="none" stroke="#40916c" stroke-width="4"/>
    <text x="450" y="238" text-anchor="middle" font-size="20">각 부분을 정렬 → 1 5  |  3 4</text>
    <path d="M365 252v48M535 252v48M365 300h170" fill="none" stroke="#40916c" stroke-width="4"/><path d="m528 293 7 12 7-12" fill="none" stroke="#40916c" stroke-width="4"/>
    <text x="450" y="332" text-anchor="middle" font-size="20">두 포인터로 더 작은 값을 차례로 선택</text>
    <g stroke="#2d6a4f" stroke-width="2"><rect x="250" y="354" width="100" height="48" rx="8" fill="#b7dfc5"/><rect x="350" y="354" width="100" height="48" rx="8" fill="#b7dfc5"/><rect x="450" y="354" width="100" height="48" rx="8" fill="#b7dfc5"/><rect x="550" y="354" width="100" height="48" rx="8" fill="#b7dfc5"/></g>
    <text x="300" y="386" text-anchor="middle" font-size="23">1</text><text x="400" y="386" text-anchor="middle" font-size="23">3</text><text x="500" y="386" text-anchor="middle" font-size="23">4</text><text x="600" y="386" text-anchor="middle" font-size="23">5</text>
  </g>
</svg>
