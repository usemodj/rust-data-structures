<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">다익스트라 최단 거리 확정</title><desc id="desc">음이 아닌 가중치 그래프에서 가장 작은 임시 거리를 선택하고 완화하는 과정</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#287b57"/></marker></defs><rect width="900" height="440" rx="18" fill="#f1faf4"/><text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#174c38">다익스트라: 최솟값 확정과 완화</text>
  <rect x="30" y="65" width="510" height="330" rx="16" fill="#d9f2df" stroke="#69a982" stroke-width="2"/><text x="285" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#24583f">음이 아닌 가중치</text>
  <g stroke="#287b57" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M120 205L270 140"/><path d="M120 205L270 285"/><path d="M300 140L455 205"/><path d="M300 285L455 205"/></g><g font-size="18" fill="#174c38"><text x="185" y="155">4</text><text x="185" y="270">1</text><text x="370" y="155">1</text><text x="370" y="275">2</text></g>
  <g fill="#fff" stroke="#287b57" stroke-width="3"><circle cx="90" cy="210" r="34" fill="#bde8c9"/><circle cx="290" cy="140" r="34"/><circle cx="290" cy="285" r="34"/><circle cx="475" cy="210" r="34"/></g><g text-anchor="middle" font-size="20" font-weight="700" fill="#174c38"><text x="90" y="217">A</text><text x="290" y="147">B</text><text x="290" y="292">C</text><text x="475" y="217">D</text></g>
  <rect x="570" y="65" width="300" height="330" rx="16" fill="#e6f0ff" stroke="#7398c7" stroke-width="2"/><text x="720" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#254d78">거리 갱신</text><g font-size="19" fill="#254d78"><text x="600" y="140">초기: A=0, B=∞, C=∞, D=∞</text><text x="600" y="195">A 확정 → B=4, C=1</text><text x="600" y="250">C 확정 → D=3</text><text x="600" y="305">D 확정: 최단 거리 3</text><text x="600" y="360" font-weight="700">결과: [0, 4, 1, 3]</text></g>
</svg>