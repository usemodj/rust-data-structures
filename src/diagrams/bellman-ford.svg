<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">벨만–포드의 반복 완화</title><desc id="desc">음의 간선이 있는 방향 그래프에서 모든 간선을 반복해 거리 0, 4, 2로 완화하는 과정</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#287b57"/></marker></defs><rect width="900" height="440" rx="18" fill="#f1faf4"/><text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#174c38">벨만–포드: 모든 간선 반복 완화</text>
  <rect x="30" y="65" width="490" height="330" rx="16" fill="#d9f2df" stroke="#69a982" stroke-width="2"/><text x="275" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#24583f">음의 간선도 허용</text><g stroke="#287b57" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M117 208L257 157"/><path d="M119 220L431 220"/><path d="M322 159L433 206"/></g><g font-size="19" fill="#174c38"><text x="180" y="155">4</text><text x="270" y="245">5</text><text x="370" y="155">−2</text></g><g fill="#fff" stroke="#287b57" stroke-width="3"><circle cx="85" cy="220" r="34" fill="#bde8c9"/><circle cx="290" cy="145" r="34"/><circle cx="465" cy="220" r="34"/></g><g text-anchor="middle" font-size="20" font-weight="700" fill="#174c38"><text x="85" y="227">A</text><text x="290" y="152">B</text><text x="465" y="227">C</text></g>
  <rect x="550" y="65" width="320" height="330" rx="16" fill="#e6f0ff" stroke="#7398c7" stroke-width="2"/><text x="710" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#254d78">반복 결과</text><g font-size="19" fill="#254d78"><text x="580" y="145">초기: [0, ∞, ∞]</text><text x="580" y="205">1회: A→B, B→C</text><text x="580" y="250">거리: [0, 4, 2]</text><text x="580" y="305">2회: 변화 없음</text><text x="580" y="360" font-weight="700">V−1회 후 확정</text></g>
</svg>