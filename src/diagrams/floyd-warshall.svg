<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
  <title id="title">코드 예제의 플로이드–워셜 거리 갱신</title>
  <desc id="desc">정점 0에서 1로 가중치 4, 0에서 2로 가중치 11, 1에서 2로 가중치 마이너스 2인 방향 그래프에서 k가 1일 때 0에서 2의 거리가 11에서 2로 갱신된다. 초기 거리 행렬과 최종 거리 행렬을 함께 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 4L0 8Z" fill="#287b57" />
    </marker>
  </defs>
  <rect width="1120" height="550" rx="18" fill="#f1faf4" />
  <text x="560" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#174c38">플로이드–워셜: 코드 예제의 거리 갱신</text>

  <rect x="25" y="65" width="420" height="455" rx="16" fill="#d9f2df" stroke="#69a982" stroke-width="2" />
  <text x="235" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#24583f">입력 방향 그래프 (weights)</text>
  <g fill="none" stroke="#287b57" stroke-width="4" marker-end="url(#arrow)">
    <path d="M137 252L211 181" />
    <path d="M259 181L333 252" />
    <path d="M157 282L318 282" stroke="#718096" stroke-dasharray="9 7" marker-end="url(#arrow)" />
  </g>
  <g fill="#fff" stroke="#287b57" stroke-width="3">
    <circle cx="105" cy="282" r="37" />
    <circle cx="235" cy="155" r="37" fill="#bde8c9" />
    <circle cx="365" cy="282" r="37" />
  </g>
  <g text-anchor="middle" font-size="21" font-weight="700" fill="#174c38">
    <text x="105" y="289">0</text>
    <text x="235" y="162">1 (k)</text>
    <text x="365" y="289">2</text>
  </g>
  <g font-size="19" font-weight="700" fill="#174c38" paint-order="stroke" stroke="#d9f2df" stroke-width="6" stroke-linejoin="round">
    <text x="160" y="207">4</text>
    <text x="305" y="207">−2</text>
    <text x="235" y="315" text-anchor="middle" fill="#526174">직접 간선 11</text>
  </g>
  <text x="235" y="390" text-anchor="middle" font-size="16" fill="#24583f">초록 경로: 0 → 1 → 2</text>
  <text x="235" y="418" text-anchor="middle" font-size="16" fill="#24583f">회색 점선: 직접 간선 0 → 2</text>

  <rect x="460" y="65" width="300" height="455" rx="16" fill="#e6f0ff" stroke="#7398c7" stroke-width="2" />
  <text x="610" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#254d78">초기화 후 거리 행렬 D</text>
  <g font-size="17" text-anchor="middle" fill="#254d78">
    <text x="550" y="157">0</text><text x="610" y="157">1</text><text x="670" y="157">2</text>
    <text x="500" y="197">0</text><text x="500" y="247">1</text><text x="500" y="297">2</text>
    <text x="550" y="197">0</text><text x="610" y="197">4</text><text x="670" y="197">11</text>
    <text x="550" y="247">∞</text><text x="610" y="247">0</text><text x="670" y="247">−2</text>
    <text x="550" y="297">∞</text><text x="610" y="297">∞</text><text x="670" y="297">0</text>
  </g>
  <text x="610" y="370" text-anchor="middle" font-size="15" fill="#526174">대각선은 0으로 초기화</text>

  <rect x="775" y="65" width="320" height="455" rx="16" fill="#fff4d8" stroke="#d5a94b" stroke-width="2" />
  <text x="935" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#76540e">최종 거리 행렬 D</text>
  <g font-size="17" text-anchor="middle" fill="#76540e">
    <text x="875" y="157">0</text><text x="935" y="157">1</text><text x="995" y="157">2</text>
    <text x="825" y="197">0</text><text x="825" y="247">1</text><text x="825" y="297">2</text>
    <text x="875" y="197">0</text><text x="935" y="197">4</text>
    <rect x="969" y="173" width="52" height="34" rx="8" fill="#bde8c9" />
    <text x="995" y="197" font-weight="700">2</text>
    <text x="875" y="247">∞</text><text x="935" y="247">0</text><text x="995" y="247">−2</text>
    <text x="875" y="297">∞</text><text x="935" y="297">∞</text><text x="995" y="297">0</text>
  </g>
  <path d="M805 330H1065" stroke="#d5a94b" stroke-width="2" />
  <text x="935" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#76540e">k = 1 경유:</text>
  <text x="935" y="394" text-anchor="middle" font-size="16" fill="#76540e">D[0][2] = min(11, 4 + (−2))</text>
  <text x="935" y="422" text-anchor="middle" font-size="16" font-weight="700" fill="#287b57">= 2</text>
</svg>