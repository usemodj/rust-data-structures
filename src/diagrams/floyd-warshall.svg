<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">플로이드–워셜 중간 정점 갱신</title><desc id="desc">중간 정점 B를 허용해 A에서 C의 직접 거리 11을 A에서 B에서 C의 2로 갱신하는 행렬</desc>
  <rect width="900" height="440" rx="18" fill="#f1faf4"/><text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#174c38">플로이드–워셜: 중간 정점 갱신</text>
  <rect x="35" y="70" width="380" height="325" rx="16" fill="#d9f2df" stroke="#69a982" stroke-width="2"/><text x="225" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#24583f">k = B를 거치는 경로</text><g stroke="#287b57" stroke-width="4" fill="none"><path d="M105 220L210 155L335 220"/><path d="M105 220L335 220" stroke-dasharray="10 8"/></g><g fill="#fff" stroke="#287b57" stroke-width="3"><circle cx="85" cy="225" r="34"/><circle cx="225" cy="145" r="34" fill="#bde8c9"/><circle cx="355" cy="225" r="34"/></g><g text-anchor="middle" font-size="20" font-weight="700" fill="#174c38"><text x="85" y="232">A</text><text x="225" y="152">B</text><text x="355" y="232">C</text></g><g font-size="19" fill="#174c38"><text x="145" y="165">1</text><text x="285" y="165">1</text><text x="205" y="255">직접 11</text></g>
  <rect x="450" y="70" width="415" height="325" rx="16" fill="#e6f0ff" stroke="#7398c7" stroke-width="2"/><text x="657" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#254d78">거리 행렬 D</text><g font-size="18" text-anchor="middle" fill="#254d78"><text x="550" y="145">  A    B    C</text><text x="490" y="190" text-anchor="start">A</text><text x="490" y="235" text-anchor="start">B</text><text x="490" y="280" text-anchor="start">C</text><text x="550" y="190">0</text><text x="625" y="190">1</text><text x="700" y="190">11</text><text x="550" y="235">∞</text><text x="625" y="235">0</text><text x="700" y="235">1</text><text x="550" y="280">∞</text><text x="625" y="280">∞</text><text x="700" y="280">0</text><path d="M520 305H790" stroke="#7398c7" stroke-width="2"/><text x="657" y="345" font-weight="700">D[A,C] = min(11, 1+1) = 2</text></g>
</svg>