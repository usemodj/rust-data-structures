<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">이진 검색 트리와 중위 순회</title>
  <desc id="desc">왼쪽 키는 작고 오른쪽 키는 큰 이진 검색 트리와 오름차순 중위 순회 결과</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d8065"/></marker></defs>
  <rect width="900" height="440" rx="18" fill="#f1faf4"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#174c38">이진 검색 트리 (BST)</text>
  <text x="450" y="70" text-anchor="middle" font-size="18" fill="#31554a">왼쪽 &lt; 부모 &lt; 오른쪽</text>
  <g stroke="#4d8065" stroke-width="3" fill="none"><path d="M450 125L290 220"/><path d="M450 125L610 220"/><path d="M290 250L205 330"/><path d="M290 250L375 330"/><path d="M610 250L535 330"/><path d="M610 250L700 330"/></g>
  <g fill="#fff" stroke="#33805b" stroke-width="3"><circle cx="450" cy="110" r="34"/><circle cx="290" cy="235" r="34"/><circle cx="610" cy="235" r="34"/><circle cx="205" cy="345" r="34"/><circle cx="375" cy="345" r="34"/><circle cx="535" cy="345" r="34"/><circle cx="700" cy="345" r="34"/></g>
  <g font-size="21" text-anchor="middle" font-weight="700" fill="#174c38"><text x="450" y="117">8</text><text x="290" y="242">3</text><text x="610" y="242">12</text><text x="205" y="352">1</text><text x="375" y="352">6</text><text x="535" y="352">10</text><text x="700" y="352">15</text></g>
  <text x="330" y="180" font-size="18" fill="#24583f">작은 값</text><text x="550" y="180" font-size="18" fill="#24583f">큰 값</text>
  <path d="M95 402H805" stroke="#7aa889" stroke-width="2"/>
  <text x="450" y="425" text-anchor="middle" font-size="18" fill="#31554a">중위 순회: 1 → 3 → 6 → 8 → 10 → 12 → 15 (오름차순)</text>
</svg>
