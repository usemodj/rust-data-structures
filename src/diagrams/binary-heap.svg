<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">BinaryHeap 최대 힙</title>
  <desc id="desc">부모가 자식보다 크거나 같은 완전 이진 트리와 배열 인덱스의 관계</desc>
  <rect width="900" height="440" fill="#f2fbf4"/><text x="450" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#174d35">BinaryHeap: 최대 힙의 우선순위</text>
  <g stroke="#28744b" stroke-width="3" fill="none"><path d="M450 120 L280 220 M450 120 L620 220 M280 260 L180 345 M280 260 L380 345 M620 260 L520 345 M620 260 L720 345"/></g>
  <g font-family="sans-serif" text-anchor="middle" font-size="21" fill="#173b2b"><circle cx="450" cy="105" r="34" fill="#f6ca63" stroke="#b68120" stroke-width="3"/><text x="450" y="112">90</text><circle cx="280" cy="245" r="34" fill="#d5f1df" stroke="#3b8f62" stroke-width="3"/><text x="280" y="252">70</text><circle cx="620" cy="245" r="34" fill="#d5f1df" stroke="#3b8f62" stroke-width="3"/><text x="620" y="252">60</text><circle cx="180" cy="370" r="30" fill="#cce8f5" stroke="#397da0" stroke-width="3"/><text x="180" y="377">40</text><circle cx="380" cy="370" r="30" fill="#cce8f5" stroke="#397da0" stroke-width="3"/><text x="380" y="377">50</text><circle cx="520" cy="370" r="30" fill="#cce8f5" stroke="#397da0" stroke-width="3"/><text x="520" y="377">30</text><circle cx="720" cy="370" r="30" fill="#cce8f5" stroke="#397da0" stroke-width="3"/><text x="720" y="377">20</text></g>
  <g font-family="sans-serif" font-size="17" fill="#356451"><text x="55" y="95">트리: 부모 ≥ 자식</text><text x="55" y="125">루트가 최댓값</text><text x="55" y="175">배열 인덱스</text><text x="55" y="202">부모 i → 자식 2i+1, 2i+2</text><text x="55" y="229">(0부터 시작)</text><text x="450" y="410" text-anchor="middle">인덱스: 0    1    2    3    4    5    6</text><text x="450" y="432" text-anchor="middle">배열: [90, 70, 60, 40, 50, 30, 20] — 트리와 배열은 개념적으로 같은 완전 이진 힙</text></g>
</svg>
