<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Vec로 구현한 스택</title>
  <desc id="desc">Vec의 끝을 스택의 top으로 사용해 마지막 입력이 먼저 나오는 LIFO 개념도</desc>
  <rect width="900" height="440" rx="24" fill="#f3fbf4"/>
  <text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#174d35">스택: 마지막 입력이 먼저 출력</text>
  <text x="450" y="84" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#38634d">Rust에서는 보통 Vec의 끝을 top으로 삼아 push와 pop을 수행합니다</text>
  <path d="M315 122h270v230H315z" fill="#e6f5e8" stroke="#28784d" stroke-width="4"/>
  <path d="M315 180h270M315 238h270M315 296h270" stroke="#28784d" stroke-width="2"/>
  <rect x="318" y="299" width="264" height="50" fill="#c8e9cf"/><rect x="318" y="241" width="264" height="50" fill="#b9e2c2"/><rect x="318" y="183" width="264" height="50" fill="#a8d9b4"/>
  <text x="450" y="217" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#174d35">세 번째</text><text x="450" y="275" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#174d35">두 번째</text><text x="450" y="333" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#174d35">첫 번째</text>
  <text x="610" y="155" font-family="sans-serif" font-size="22" font-weight="700" fill="#a25a13">top (Vec의 끝)</text><path d="M600 208h-20" stroke="#d47b24" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="398" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#38634d">pop → 세 번째 → 두 번째 → 첫 번째 (LIFO)</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#d47b24"/></marker></defs>
</svg>
