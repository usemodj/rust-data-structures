<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">KMP 접두사 표와 겹치는 일치</title>
  <desc id="desc">패턴 ABABA의 lps 표는 0, 0, 1, 2, 3이다. 텍스트 ABABABA에서 KMP는 바이트 오프셋 0과 2의 겹치는 일치를 찾는다.</desc>
  <rect x="1" y="1" width="898" height="438" rx="18" fill="#f4f8ef" stroke="#d8e6d5" stroke-width="2"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="25" font-weight="700" fill="#285d43">KMP · lps로 겹치는 일치 찾기</text>
  <rect x="32" y="63" width="836" height="177" rx="16" fill="#e8f3e7" stroke="#a4c9ac" stroke-width="2"/>
  <text x="64" y="99" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#285d43">패턴</text>
  <g font-family="Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle"><g fill="#fff" stroke="#276d4c" stroke-width="2"><rect x="135" y="76" width="92" height="55" rx="8"/><rect x="235" y="76" width="92" height="55" rx="8"/><rect x="335" y="76" width="92" height="55" rx="8"/><rect x="435" y="76" width="92" height="55" rx="8"/><rect x="535" y="76" width="92" height="55" rx="8"/></g><text x="181" y="112">A</text><text x="281" y="112">B</text><text x="381" y="112">A</text><text x="481" y="112">B</text><text x="581" y="112">A</text></g>
  <text x="64" y="166" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#285d43">인덱스</text><g font-family="Consolas, monospace" font-size="19" text-anchor="middle" fill="#173b2b"><text x="181" y="166">0</text><text x="281" y="166">1</text><text x="381" y="166">2</text><text x="481" y="166">3</text><text x="581" y="166">4</text></g>
  <text x="64" y="209" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#285d43">lps</text><g font-family="Consolas, monospace" font-size="21" font-weight="700" text-anchor="middle" fill="#285d43"><text x="181" y="209">0</text><text x="281" y="209">0</text><text x="381" y="209">1</text><text x="481" y="209">2</text><text x="581" y="209">3</text></g>
  <path d="M450 240 V270" stroke="#276d4c" stroke-width="4" marker-end="url(#arrow)"/><text x="470" y="260" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" fill="#4b6955">일치 후 lps[4] = 3을 재사용</text>
  <rect x="32" y="281" width="836" height="127" rx="16" fill="#fff" stroke="#a4c9ac" stroke-width="2"/>
  <text x="64" y="314" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#285d43">텍스트</text><text x="162" y="314" font-family="Consolas, monospace" font-size="23" font-weight="700" fill="#173b2b">A B A B A B A</text>
  <g font-family="Consolas, monospace" font-size="17" text-anchor="middle" fill="#4b6955"><text x="175" y="342">0</text><text x="225" y="342">1</text><text x="275" y="342">2</text><text x="325" y="342">3</text><text x="375" y="342">4</text><text x="425" y="342">5</text><text x="475" y="342">6</text></g>
  <rect x="151" y="350" width="224" height="26" rx="8" fill="#cfe8d2"/><rect x="251" y="350" width="224" height="26" rx="8" fill="#b7dcbf"/><text x="160" y="369" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" fill="#285d43">일치 시작: 0</text><text x="450" y="369" text-anchor="end" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="18" fill="#285d43">겹치는 일치 시작: 2</text>
  <text x="650" y="337" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" fill="#80501f">위치는 바이트 오프셋</text><text x="650" y="362" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="17" fill="#80501f">UTF-8 문자 수와 다를 수 있음</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#276d4c"/></marker></defs>
</svg>
