<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 800" width="1024" height="800">
  <!-- Background -->
  <rect width="1024" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <rect x="20" y="10" width="984" height="60" fill="#2d5aa7" rx="8"/>
  <text x="512" y="45" font-size="32" font-weight="bold" fill="white" text-anchor="middle">다익스트라 알고리즘 단계별 실행</text>
  
  <!-- Subtitle -->
  <text x="512" y="90" font-size="16" fill="#555" text-anchor="middle">정점 0에서 시작하여 최단 거리를 차례로 확정</text>
  
  <!-- Step 1 -->
  <g id="step1">
    <rect x="20" y="110" width="240" height="150" fill="#e7f3ff" stroke="#2d5aa7" stroke-width="2" rx="8"/>
    <circle cx="50" cy="140" r="20" fill="#ff6b6b"/>
    <text x="50" y="148" font-size="16" font-weight="bold" fill="white" text-anchor="middle">1</text>
    <text x="130" y="145" font-size="14" font-weight="bold">정점 0 확정 (시작)</text>
    <text x="30" y="175" font-size="12" fill="#333">거리 배열:</text>
    <text x="30" y="195" font-size="11" font-family="monospace" fill="#2d5aa7">[0, ∞, ∞, ∞] → [0, 4, 1, ∞]</text>
    <text x="30" y="220" font-size="12" fill="#333">우선순위 큐:</text>
    <text x="30" y="240" font-size="11" font-family="monospace" fill="#2d5aa7">(1, 2), (4, 1) 추가</text>
  </g>
  
  <!-- Arrow 1-2 -->
  <line x1="260" y1="185" x2="300" y2="185" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2 -->
  <g id="step2">
    <rect x="300" y="110" width="240" height="150" fill="#e7f3ff" stroke="#2d5aa7" stroke-width="2" rx="8"/>
    <circle cx="330" cy="140" r="20" fill="#51cf66"/>
    <text x="330" y="148" font-size="16" font-weight="bold" fill="white" text-anchor="middle">2</text>
    <text x="410" y="145" font-size="14" font-weight="bold">정점 2 확정 (최소 거리)</text>
    <text x="310" y="175" font-size="12" fill="#333">2→1: 1+2 = 3 ✓ 개선</text>
    <text x="310" y="195" font-size="12" fill="#333">2→3: 1+5 = 6</text>
    <text x="310" y="220" font-size="12" fill="#333">거리 배열:</text>
    <text x="310" y="240" font-size="11" font-family="monospace" fill="#2d5aa7">[0, 4, 1, ∞] → [0, 3, 1, 6]</text>
  </g>
  
  <!-- Arrow 2-3 -->
  <line x1="540" y1="185" x2="580" y2="185" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3 -->
  <g id="step3">
    <rect x="580" y="110" width="240" height="150" fill="#e7f3ff" stroke="#2d5aa7" stroke-width="2" rx="8"/>
    <circle cx="610" cy="140" r="20" fill="#51cf66"/>
    <text x="610" y="148" font-size="16" font-weight="bold" fill="white" text-anchor="middle">3</text>
    <text x="690" y="145" font-size="14" font-weight="bold">정점 1 확정</text>
    <text x="590" y="175" font-size="12" fill="#333">1→3: 3+1 = 4 ✓ 개선</text>
    <text x="590" y="205" font-size="12" fill="#333">거리 배열:</text>
    <text x="590" y="225" font-size="11" font-family="monospace" fill="#2d5aa7">[0, 3, 1, 6] → [0, 3, 1, 4]</text>
  </g>
  
  <!-- Arrow 3-4 -->
  <line x1="820" y1="185" x2="860" y2="185" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4 -->
  <g id="step4">
    <rect x="860" y="110" width="144" height="150" fill="#e7f3ff" stroke="#2d5aa7" stroke-width="2" rx="8"/>
    <circle cx="890" cy="140" r="20" fill="#51cf66"/>
    <text x="890" y="148" font-size="16" font-weight="bold" fill="white" text-anchor="middle">4</text>
    <text x="932" y="145" font-size="14" font-weight="bold">정점 3 확정</text>
    <text x="870" y="180" font-size="11" fill="#333">나가는 간선</text>
    <text x="870" y="200" font-size="11" fill="#333">없음</text>
    <text x="870" y="220" font-size="11" fill="#333">최종 완료</text>
    <text x="870" y="240" font-size="11" fill="#333">✓</text>
  </g>
  
  <!-- Graph visualization section -->
  <g id="graph-section">
    <!-- Section title -->
    <text x="20" y="310" font-size="18" font-weight="bold" fill="#2d5aa7">최단 경로 추적</text>
    
    <!-- Graph nodes -->
    <circle cx="80" cy="380" r="30" fill="#90EE90" stroke="#228B22" stroke-width="2"/>
    <text x="80" y="385" font-size="16" font-weight="bold" text-anchor="middle">0</text>
    <text x="80" y="405" font-size="11" text-anchor="middle">dist: 0</text>
    
    <circle cx="220" cy="380" r="30" fill="#90EE90" stroke="#228B22" stroke-width="2"/>
    <text x="220" y="385" font-size="16" font-weight="bold" text-anchor="middle">2</text>
    <text x="220" y="405" font-size="11" text-anchor="middle">dist: 1</text>
    
    <circle cx="360" cy="380" r="30" fill="#90EE90" stroke="#228B22" stroke-width="2"/>
    <text x="360" y="385" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    <text x="360" y="405" font-size="11" text-anchor="middle">dist: 3</text>
    
    <circle cx="500" cy="380" r="30" fill="#FFB6C6" stroke="#C71585" stroke-width="3"/>
    <text x="500" y="385" font-size="16" font-weight="bold" text-anchor="middle">3</text>
    <text x="500" y="405" font-size="11" text-anchor="middle">dist: 4</text>
    
    <!-- Edges -->
    <line x1="110" y1="380" x2="190" y2="380" stroke="#2d5aa7" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    <text x="150" y="370" font-size="12" fill="#2d5aa7" text-anchor="middle" font-weight="bold">+1</text>
    
    <line x1="250" y1="380" x2="330" y2="380" stroke="#2d5aa7" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    <text x="290" y="370" font-size="12" fill="#2d5aa7" text-anchor="middle" font-weight="bold">+2</text>
    
    <line x1="390" y1="380" x2="470" y2="380" stroke="#2d5aa7" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    <text x="430" y="370" font-size="12" fill="#2d5aa7" text-anchor="middle" font-weight="bold">+1</text>
  </g>
  
  <!-- Final result box -->
  <rect x="20" y="460" width="984" height="100" fill="#fff3cd" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="40" y="490" font-size="14" font-weight="bold" fill="#333">🏆 최단 경로 및 최종 결과</text>
  <text x="40" y="520" font-size="13" fill="#333" font-family="monospace">최단 경로: 0 → 2 (비용 1) → 1 (비용 2) → 3 (비용 1)</text>
  <text x="40" y="545" font-size="13" fill="#333" font-family="monospace">거리 배열: [Some(0), Some(3), Some(1), Some(4)]</text>
  
  <!-- Legend -->
  <g id="legend">
    <text x="40" y="600" font-size="14" font-weight="bold" fill="#2d5aa7">범례</text>
    
    <circle cx="60" cy="630" r="12" fill="#ff6b6b"/>
    <text x="80" y="635" font-size="12" fill="#333">현재 처리 중인 단계</text>
    
    <circle cx="320" cy="630" r="12" fill="#51cf66"/>
    <text x="340" y="635" font-size="12" fill="#333">확정된 정점</text>
    
    <circle cx="580" cy="630" r="12" fill="#90EE90" stroke="#228B22" stroke-width="2"/>
    <text x="600" y="635" font-size="12" fill="#333">경로 상의 정점</text>
    
    <circle cx="800" cy="630" r="12" fill="#FFB6C6" stroke="#C71585" stroke-width="2"/>
    <text x="820" y="635" font-size="12" fill="#333">최종 도착점</text>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2d5aa7"/>
    </marker>
  </defs>
</svg>
